<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Records - Supabase</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f5f7f8] min-h-screen p-6 flex flex-col items-center">
  <div class="w-full max-w-[420px] bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <h2 class="text-center font-semibold text-gray-800 text-lg mb-4">Add New Student</h2>
    <form id="studentForm" class="space-y-3">
      <input id="fullName" placeholder="Full Name" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
      <input id="age" type="number" placeholder="Age" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
      <input id="email" type="email" placeholder="Email" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
      <input id="course" placeholder="Course (e.g. MERN)" value="MERN" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
      <button type="submit" class="w-full bg-[#2a8fd7] hover:bg-[#1f7ac0] text-white py-2 rounded-md text-sm font-medium">Add Student</button>
    </form>
    <p id="status" class="text-xs text-center mt-2 text-gray-500"></p>
  </div>

  <div class="w-full max-w-[420px] mt-6">
    <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-3 text-center font-semibold text-gray-800 mb-3">Students Data</div>
    <div id="studentsList" class="space-y-2"></div>
    <p id="loading" class="text-center text-sm text-gray-400 mt-4">Loading...</p>
  </div>

<script>
const SUPABASE_URL = 'https://xfucvaqwnewjqehqbjmr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_FbYVGBL2Cb1s_WH1qnZiyg_jAI0FPqL';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const listEl = document.getElementById('studentsList');
const loadingEl = document.getElementById('loading');
const statusEl = document.getElementById('status');

function render(students){
  listEl.innerHTML='';
  if(students.length===0){ listEl.innerHTML='<p class="text-center text-sm text-gray-400">No students yet</p>'; return; }
  listEl.innerHTML = students.map(s=>`
    <div class="bg-white rounded-md border-l-[3px] border-l-[#2a8fd7] shadow-sm flex justify-between items-center px-3 py-2.5">
      <div>
        <p class="text-sm font-semibold text-gray-800 leading-tight">${s.name}</p>
        <p class="text-[11px] text-gray-500">Age: ${s.age} | ${s.email} | ${s.course || ''}</p>
      </div>
      <button data-id="${s.id}" class="deleteBtn bg-[#e74c3c] text-white text-[11px] px-3 py-1 rounded">Delete</button>
    </div>
  `).join('');
}

async function fetchStudents(){
  loadingEl.style.display='block';
  const {data, error} = await supabaseClient.from('students').select('*').order('created_at',{ascending:false});
  if(error){ statusEl.textContent='Error: '+error.message; console.error(error); }
  else render(data);
  loadingEl.style.display='none';
}

async function addStudent(e){
  e.preventDefault();
  const name = document.getElementById('fullName').value.trim();
  const age = parseInt(document.getElementById('age').value);
  const email = document.getElementById('email').value.trim();
  const course = document.getElementById('course').value.trim() || 'MERN';
  if(!name||!age||!email) return;
  statusEl.textContent='Adding...';
  const {data, error} = await supabaseClient.from('students').insert([{name, age, email, course}]).select();
  if(error){ statusEl.textContent=error.message; console.error(error); }
  else { statusEl.textContent='Student added!'; e.target.reset(); document.getElementById('course').value='MERN'; fetchStudents(); }
}

async function deleteStudent(id){
  const {error} = await supabaseClient.from('students').delete().eq('id', id);
  if(error) alert(error.message); else fetchStudents();
}

document.getElementById('studentForm').addEventListener('submit', addStudent);
listEl.addEventListener('click', e=>{
  if(e.target.classList.contains('deleteBtn')) deleteStudent(e.target.dataset.id);
});

fetchStudents();
</script>
</body>
</html>
